[pytest]
# JARVIS v2 — pytest yapılandırması
# Tüm property-based testler Hypothesis "default" profili (100 examples) altında çalışır.
# Daha hızlı geri bildirim için "fast" (20 examples), CI / nightly için "thorough" (500 examples).

minversion = 7.0

testpaths =
    tests/unit
    tests/integration

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

# Default Hypothesis profili conftest.py içinde kayıt edilir ve burada seçilir.
# Override için: pytest --hypothesis-profile=fast veya thorough.
addopts =
    -ra
    --strict-markers
    --strict-config
    --hypothesis-profile=default
    --hypothesis-show-statistics

markers =
    unit: hızlı, izole birim testleri
    property: Hypothesis property-based testleri (her biri @settings(max_examples=100))
    integration: GUI / COM / dosya sistemi gibi dış kaynak içeren entegrasyon testleri
    smoke: tam başlatma akışını doğrulayan smoke testleri
    slow: 5 saniyeden uzun sürmesi beklenen testler
    windows_only: yalnızca Windows üzerinde anlamlı olan testler
    gui: Tkinter root gerektiren testler

filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pkg_resources.*
